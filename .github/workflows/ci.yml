name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Generate protobuf
        run: go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate
      - name: Generated code is current
        run: git diff --exit-code
      - name: Protobuf lint
        run: go run github.com/bufbuild/buf/cmd/buf@v1.47.2 lint
      - name: Protobuf compatibility
        if: github.event_name == 'pull_request'
        run: go run github.com/bufbuild/buf/cmd/buf@v1.47.2 breaking --against '.git#branch=main'
      - name: Static checks
        run: go vet ./...
      - name: Unit and integration tests
        run: go test ./...
        env:
          TIDE_TEST_REDIS_ADDR: 127.0.0.1:6379
      - name: Race tests
        run: go test -race ./...
      - name: Build commands
        run: go build ./cmd/gateway ./cmd/mock-asr ./cmd/loadgen

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway
        run: docker build --build-arg TARGET=gateway -t tide-gateway:test .
      - name: Build mock ASR
        run: docker build --build-arg TARGET=mock-asr -t tide-mock-asr:test .

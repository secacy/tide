apiVersion: v1
kind: ConfigMap
metadata:
  name: tide-gateway
data:
  TIDE_ENV: production
  TIDE_HTTP_ADDR: ":8080"
  TIDE_METRICS_ADDR: ":8081"
  TIDE_PEER_ADDR: ":9090"
  TIDE_ASR_ADDR: "asr.speech-platform.svc.cluster.local:9091"
  TIDE_PUBLIC_WS_BASE_URL: "wss://voice-gateway.example.com"
  TIDE_JWT_JWKS_URL: "https://identity.example.com/.well-known/jwks.json"
  TIDE_JWT_ISSUER: "https://identity.example.com/"
  TIDE_JWT_AUDIENCE: "tide-gateway"
  TIDE_ALLOWED_ORIGINS: "doctor.example.com"
  TIDE_TENANT_MAX_STREAMS: "10000"
  TIDE_MAX_CONNECTIONS: "10000"
  TIDE_CREATE_RATE_PER_MIN: "20000"
  TIDE_CONNECT_RATE_PER_MIN: "30000"
  TIDE_ASR_TLS_CA: "/etc/tide/tls/ca.crt"
  TIDE_ASR_TLS_CERT: "/etc/tide/tls/tls.crt"
  TIDE_ASR_TLS_KEY: "/etc/tide/tls/tls.key"
  TIDE_PEER_TLS_CA: "/etc/tide/tls/ca.crt"
  TIDE_PEER_TLS_CERT: "/etc/tide/tls/tls.crt"
  TIDE_PEER_TLS_KEY: "/etc/tide/tls/tls.key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tide-gateway
  labels:
    app.kubernetes.io/name: tide-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tide-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tide-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/example/tide-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: peer
              containerPort: 9090
            - name: metrics
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: tide-gateway
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TIDE_NODE_ID
              value: "$(POD_NAME)"
            - name: TIDE_PEER_ADVERTISE_ADDR
              value: "$(POD_IP):9090"
            - name: TIDE_REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: tide-runtime
                  key: redis-address
            - name: TIDE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tide-runtime
                  key: redis-password
            - name: TIDE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tide-runtime
                  key: token-secret
          volumeMounts:
            - name: mtls
              mountPath: /etc/tide/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "16"
              memory: 32Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: mtls
          secret:
            secretName: tide-mtls
---
apiVersion: v1
kind: Service
metadata:
  name: tide-gateway
spec:
  selector:
    app.kubernetes.io/name: tide-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: peer
      port: 9090
      targetPort: peer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tide-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tide-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tide-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tide-gateway
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Pods
      pods:
        metric:
          name: tide_active_connections
        target:
          type: AverageValue
          averageValue: "8000"

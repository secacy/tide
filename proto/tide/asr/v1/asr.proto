syntax = "proto3";

package tide.asr.v1;

option go_package = "github.com/secacy/tide-artisan/proto/tide/asr/v1;asrv1";

service ASRService {
  rpc StreamingRecognize(stream StreamingRecognizeRequest)
      returns (stream StreamingRecognizeResponse);
}

message StreamingRecognizeRequest {
  bytes data = 1;
}

// AudioProgress 表示本次识别流的累计音频处理进度。
// 与是否产生识别文本无关；静音音频也应推进处理进度。
message AudioProgress {
  // 从本次流起点开始，连续完成处理的原始音频字节数。
  // 不包含协议头或控制消息，按流单调不减。
  // 仅收到音频或将音频放入内部队列，不算完成处理。
  uint64 processed_audio_bytes = 1;
}

message StreamingRecognizeResponse {
  string segment_id = 1;
  string text = 2;
  bool is_final = 3;

  // 存在时，本条响应只表示处理进度；segment_id、text 应为空，is_final 应为 false。
  // 不存在时，按原有识别结果解析。
  AudioProgress progress = 4;

  // 如果后续需要定位音频、展示时间轴或测量结果延迟，可以考虑使用 audio_end_offset_ms 表示：这条结果对应的音频结束位置，相对于本次识别流音频起点的毫秒偏移。
}



